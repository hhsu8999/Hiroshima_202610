<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS PWA / Web App 最佳化 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="廣島四國漫遊">
  <title>2026 廣島・四國 隨行旅遊手札 (10/29 - 11/02)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Leaflet.js 開源地圖核心 (100% 免 API Key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            seto: {
              50: '#F0F7FB',
              100: '#E1F0F7',
              200: '#C2E0EF',
              500: '#2A7FA8',
              600: '#1E6589',
              700: '#174F6D',
              800: '#123D54',
              900: '#0B2736',
            },
            torii: {
              500: '#E64A19',
              600: '#D84315',
              700: '#BF360C',
            },
            matcha: {
              50: '#F4F7F4',
              100: '#E2EBE2',
              600: '#2E7D32',
              700: '#1B5E20',
            },
            gold: {
              400: '#FBBF24',
              500: '#F59E0B',
              600: '#D97706',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(18, 61, 84, 0.08)',
            'elevated': '0 10px 26px -4px rgba(18, 61, 84, 0.16)',
            'float': '0 14px 34px -6px rgba(23, 79, 109, 0.3)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Leaflet 地圖圖釘與自訂標籤 */
    .leaflet-marker-icon {
      overflow: visible !important;
    }

    .custom-marker-wrapper {
      position: relative;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 1. 住宿飯店：金色發光巨星 + 脈衝水波動畫 */
    .marker-hotel {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FDE047 0%, #D97706 100%);
      border: 3px solid #FFFFFF;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      position: relative;
      z-index: 999;
    }
    .hotel-pulse {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid #F59E0B;
      animation: pulse-ring 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      pointer-events: none;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.85); opacity: 0.95; }
      70% { transform: scale(1.8); opacity: 0.2; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* 2. 精選美食：暖橘紅水滴標記 */
    .marker-food {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF7043, #E64A19);
      border: 2px solid #FFFFFF;
      box-shadow: 0 3px 10px rgba(230, 74, 25, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* 3. 必訪景點：常盤翠綠圓標 */
    .marker-spot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #34D399, #059669);
      border: 2px solid #FFFFFF;
      box-shadow: 0 3px 10px rgba(5, 150, 105, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* 4. 交通接駁：瀨戶內蔚藍圓標 */
    .marker-transport {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38BDF8, #0284C7);
      border: 2px solid #FFFFFF;
      box-shadow: 0 3px 9px rgba(2, 132, 199, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    /* 圖釘名稱膠囊標籤 */
    .marker-label {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(3px);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      padding: 1.5px 6px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(4px);
      color: #1E293B;
      white-space: nowrap;
      border: 1px solid rgba(203, 213, 225, 0.9);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 50;
    }
    .marker-label-hotel {
      background: #FEF3C7;
      color: #92400E;
      border-color: #FCD34D;
      font-weight: 800;
    }

    /* GPS 藍色定位脈衝點 */
    .gps-marker {
      width: 16px;
      height: 16px;
      background: #2563EB;
      border: 2.5px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.8);
      position: relative;
    }
    .gps-pulse-ring {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.35);
      animation: gps-pulse 1.8s infinite;
    }
    @keyframes gps-pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* Leaflet Popup 樣式優化 */
    .leaflet-popup-content-wrapper {
      padding: 0 !important;
      border-radius: 16px !important;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.22) !important;
      overflow: hidden;
      border: 1px solid rgba(226, 232, 240, 0.9);
      background: #FFFFFF !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      line-height: 1.4 !important;
    }
    .leaflet-popup-tip {
      background: #FFFFFF !important;
    }
    
    #full-screen-map {
      width: 100%;
      height: 100%;
      background-color: #F1F5F9;
    }
  </style>
</head>

<body class="bg-[#F8FAFC] text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-seto-100">

  <!-- ================= 頂部常駐導覽列與分頁切換 (Sticky Header) ================= -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-2xs">
    <div class="max-w-md mx-auto px-4 pt-2.5 pb-2">
      <!-- 頂部標題與打卡達成率 -->
      <div class="flex items-center justify-between mb-2">
        <div>
          <div class="flex items-center gap-1.5">
            <span class="inline-block text-[9.5px] font-extrabold tracking-wider text-seto-700 bg-seto-100 px-2 py-0.5 rounded-full">
              2026/10/29 - 11/02 ‧ 5天4夜
            </span>
            <span class="inline-block text-[9.5px] font-bold text-torii-600 bg-orange-50 px-1.5 py-0.5 rounded-md border border-orange-200">
              去CI112 ｜ 回CI179
            </span>
          </div>
          <h1 class="text-base font-black text-slate-900 mt-1 tracking-tight flex items-center gap-1.5">
            <span>⛩️</span>
            <span>2026 廣島・四國隨行手札</span>
          </h1>
        </div>

        <!-- 打卡達成率徽章 -->
        <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-2.5 py-1.5 rounded-xl shadow-2xs">
          <div class="text-right">
            <div class="text-[9px] text-slate-400 font-medium leading-none">行程打卡</div>
            <div class="text-xs font-bold text-seto-700 mt-0.5" id="header-progress-text">0 / 45 處</div>
          </div>
          <div class="relative w-6 h-6 flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
              <path class="text-slate-200" stroke-width="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              <path id="header-progress-circle" class="text-seto-600 transition-all duration-500" stroke-width="4" stroke-dasharray="0, 100" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            </svg>
            <span class="text-[8px] font-bold text-seto-700 absolute" id="header-progress-pct">0%</span>
          </div>
        </div>
      </div>

      <!-- 原生質感分頁切換列 (Segmented Control) -->
      <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-xl border border-slate-200 shadow-inner">
        <button 
          id="tab-btn-list"
          onclick="switchTab('list')" 
          class="flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-bold transition-all duration-200 bg-white text-seto-800 shadow-sm"
        >
          <span>📋</span>
          <span>行程表 (Itinerary)</span>
        </button>
        <button 
          id="tab-btn-map"
          onclick="switchTab('map')" 
          class="flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-600 hover:text-slate-900"
        >
          <span>🗺️</span>
          <span>地圖地理 (Map)</span>
        </button>
      </div>
    </div>
  </header>


  <!-- ================= 分頁 1：行程清單 (List View) ================= -->
  <main id="view-list" class="max-w-md mx-auto px-4 pt-3 pb-24 w-full space-y-3.5 flex-1">

    <!-- 天數切換與篩選控制器 (Day 1 - Day 5) -->
    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">日程切換</span>
        <span id="day-summary-text" class="text-[10px] text-seto-600 font-semibold">顯示全部 5 天行程</span>
      </div>
      
      <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar pb-0.5">
        <button onclick="filterDay('all')" data-day="all" class="day-chip px-3 py-1.5 rounded-full text-xs font-bold transition-all whitespace-nowrap bg-seto-700 text-white shadow-xs">
          全部 (5天)
        </button>
        <button onclick="filterDay(1)" data-day="1" class="day-chip px-3 py-1.5 rounded-full text-xs font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200">
          D1 廣島
        </button>
        <button onclick="filterDay(2)" data-day="2" class="day-chip px-3 py-1.5 rounded-full text-xs font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200">
          D2 宮島
        </button>
        <button onclick="filterDay(3)" data-day="3" class="day-chip px-3 py-1.5 rounded-full text-xs font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200">
          D3 倉敷/鷲羽山
        </button>
        <button onclick="filterDay(4)" data-day="4" class="day-chip px-3 py-1.5 rounded-full text-xs font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200">
          D4 小豆島
        </button>
        <button onclick="filterDay(5)" data-day="5" class="day-chip px-3 py-1.5 rounded-full text-xs font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200">
          D5 高松賦歸
        </button>
      </div>

      <!-- 類別篩選 (飯店、美食、景點、交通、打卡) -->
      <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar pt-1">
        <button onclick="filterCategory('all')" data-cat="all" class="cat-chip px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all whitespace-nowrap bg-slate-800 text-white shadow-2xs">
          全部類型
        </button>
        <button onclick="filterCategory('hotel')" data-cat="hotel" class="cat-chip px-2.5 py-1 rounded-lg text-[11px] font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200">
          ⭐ 住宿飯店
        </button>
        <button onclick="filterCategory('food')" data-cat="food" class="cat-chip px-2.5 py-1 rounded-lg text-[11px] font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200">
          🍜 美食甜點
        </button>
        <button onclick="filterCategory('spot')" data-cat="spot" class="cat-chip px-2.5 py-1 rounded-lg text-[11px] font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200">
          ⛩️ 必訪景點
        </button>
        <button onclick="filterCategory('transport')" data-cat="transport" class="cat-chip px-2.5 py-1 rounded-lg text-[11px] font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200">
          🚢 渡輪交通
        </button>
        <button onclick="filterCategory('checked')" data-cat="checked" class="cat-chip px-2.5 py-1 rounded-lg text-[11px] font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200">
          ✅ 已完成
        </button>
      </div>

      <!-- 關鍵字搜尋框 -->
      <div class="relative pt-0.5">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        <input 
          type="text" 
          id="list-search-input" 
          placeholder="搜尋景點、牡蠣、渡輪、大鳥居或日文名稱..." 
          class="w-full pl-9 pr-8 py-2 bg-white border border-slate-200 rounded-xl text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-seto-600 focus:border-transparent transition-all shadow-2xs"
        >
        <button id="list-clear-search" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></button>
      </div>
    </div>

    <!-- 行程卡片容器 -->
    <div id="itinerary-cards-container" class="space-y-3.5"></div>

    <!-- 查無結果 -->
    <div id="list-empty-state" class="hidden text-center py-12 px-4 bg-white rounded-2xl border border-slate-200">
      <div class="text-3xl mb-2">🔍</div>
      <p class="text-sm font-bold text-slate-700">找不到符合條件的行程項目</p>
      <p class="text-xs text-slate-400 mt-1">請嘗試修改關鍵字或重設天數/分類篩選</p>
      <button onclick="resetFilters()" class="mt-3 px-4 py-1.5 bg-slate-100 text-slate-700 rounded-lg text-xs font-bold hover:bg-slate-200">
        重置所有篩選
      </button>
    </div>

  </main>


  <!-- ================= 分頁 2：景點地圖 (Map View) ================= -->
  <section id="view-map" class="hidden relative flex-1 w-full max-w-md mx-auto overflow-hidden flex flex-col" style="height: calc(100vh - 108px);">
    
    <!-- 地圖頂部懸浮類別過濾 Chips -->
    <div class="absolute top-2.5 inset-x-3 z-[490] flex items-center gap-1.5 overflow-x-auto hide-scrollbar pointer-events-auto py-1">
      <button onclick="filterMapCategory('all')" data-mcat="all" class="map-chip px-2.5 py-1 rounded-full text-[11px] font-bold transition-all whitespace-nowrap bg-slate-900/90 text-white shadow-md backdrop-blur-md">
        全部景點
      </button>
      <button onclick="filterMapCategory('hotel')" data-mcat="hotel" class="map-chip px-2.5 py-1 rounded-full text-[11px] font-medium transition-all whitespace-nowrap bg-white/95 text-slate-800 border border-slate-200 shadow-md backdrop-blur-md">
        ⭐ 住宿
      </button>
      <button onclick="filterMapCategory('food')" data-mcat="food" class="map-chip px-2.5 py-1 rounded-full text-[11px] font-medium transition-all whitespace-nowrap bg-white/95 text-slate-800 border border-slate-200 shadow-md backdrop-blur-md">
        🍜 美食
      </button>
      <button onclick="filterMapCategory('spot')" data-mcat="spot" class="map-chip px-2.5 py-1 rounded-full text-[11px] font-medium transition-all whitespace-nowrap bg-white/95 text-slate-800 border border-slate-200 shadow-md backdrop-blur-md">
        ⛩️ 景點
      </button>
      <button onclick="filterMapCategory('transport')" data-mcat="transport" class="map-chip px-2.5 py-1 rounded-full text-[11px] font-medium transition-all whitespace-nowrap bg-white/95 text-slate-800 border border-slate-200 shadow-md backdrop-blur-md">
        🚢 渡輪
      </button>
    </div>

    <!-- 地圖右側懸浮快捷工具組 -->
    <div class="absolute right-3 top-14 z-[490] flex flex-col gap-2">
      <!-- 🔄 防呆強制刷新重繪地圖 -->
      <button 
        onclick="forceRefreshMap()" 
        title="刷新重繪地圖"
        class="w-10 h-10 rounded-xl bg-white/95 text-slate-700 shadow-elevated flex items-center justify-center border border-slate-200 active:scale-95 transition-all text-sm font-bold backdrop-blur-md"
      >
        🔄
      </button>

      <!-- 🎯 GPS 我的位置定位 -->
      <button 
        onclick="locateUserPosition()" 
        title="定位目前位置"
        class="w-10 h-10 rounded-xl bg-white/95 text-seto-700 shadow-elevated flex items-center justify-center border border-slate-200 active:scale-95 transition-all backdrop-blur-md"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" stroke-width="2.5"></circle>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
        </svg>
      </button>

      <!-- 🌐 全覽視野還原 (瀬戶內海全景) -->
      <button 
        onclick="resetMapBounds()" 
        title="還原全覽視野"
        class="w-10 h-10 rounded-xl bg-white/95 text-slate-700 shadow-elevated flex items-center justify-center border border-slate-200 active:scale-95 transition-all text-[11px] font-bold backdrop-blur-md"
      >
        全覽
      </button>
    </div>

    <!-- 地圖快速地域跳轉 Floating Pills -->
    <div class="absolute left-3 top-14 z-[490] flex flex-col gap-1.5 pointer-events-auto">
      <button onclick="flyToRegion('hiroshima')" class="px-2 py-1 rounded-lg bg-white/90 backdrop-blur-md text-[10px] font-bold text-slate-700 shadow-sm border border-slate-200">
        📍 廣島市
      </button>
      <button onclick="flyToRegion('miyajima')" class="px-2 py-1 rounded-lg bg-white/90 backdrop-blur-md text-[10px] font-bold text-slate-700 shadow-sm border border-slate-200">
        ⛩️ 宮島
      </button>
      <button onclick="flyToRegion('kurashiki')" class="px-2 py-1 rounded-lg bg-white/90 backdrop-blur-md text-[10px] font-bold text-slate-700 shadow-sm border border-slate-200">
        🏮 倉敷美觀
      </button>
      <button onclick="flyToRegion('washuzan')" class="px-2 py-1 rounded-lg bg-white/90 backdrop-blur-md text-[10px] font-bold text-slate-700 shadow-sm border border-slate-200">
        🌉 鷲羽山
      </button>
      <button onclick="flyToRegion('shodoshima')" class="px-2 py-1 rounded-lg bg-white/90 backdrop-blur-md text-[10px] font-bold text-slate-700 shadow-sm border border-slate-200">
        🫒 小豆島
      </button>
      <button onclick="flyToRegion('takamatsu')" class="px-2 py-1 rounded-lg bg-white/90 backdrop-blur-md text-[10px] font-bold text-slate-700 shadow-sm border border-slate-200">
        🍜 高松市
      </button>
    </div>

    <!-- Leaflet 互動地圖容器 -->
    <div id="full-screen-map" class="w-full flex-1 z-0"></div>

    <!-- 地圖底部橫向滑動輪播卡片 (Carousel) -->

        tip: '機場二樓免稅店可採買最後的香川烏龍麵、愛媛蜜柑甜點與獺祭清酒',
        address: '香川県高松市香南町岡1312-7',
        query: '高松機場 高松空港',
        lat: 34.2144,
        lng: 134.0156,
        icon: '✈️',
        tag: '華航CI179・18:55起飛返台'
      }
    ];

    // 全域變數
    let activeTab = 'list';
    let currentDayFilter = 'all';
    let currentCategoryFilter = 'all';
    let currentMapCat = 'all';
    let searchQuery = '';
    const STORAGE_KEY = 'japan_trip_2026_checkmarks';
    let checkedItems = new Set();

    // Leaflet 變數
    let leafletMap = null;
    let markersLayer = null;
    let gpsMarker = null;
    const markerMap = {};

    // ================= 本機儲存與打卡進度 =================
    function initStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          checkedItems = new Set(JSON.parse(saved));
        }
      } catch (e) {
        console.warn('Storage read error', e);
      }
      updateStats();
    }

    function saveStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...checkedItems]));
      } catch (e) {
        console.warn('Storage save error', e);
      }
      updateStats();
    }

    function updateStats() {
      const total = ITINERARY_DATA.length;
      const count = checkedItems.size;
      const pct = Math.round((count / total) * 100);

      const countEl = document.getElementById('header-progress-text');
      const pctEl = document.getElementById('header-progress-pct');
      const circleEl = document.getElementById('header-progress-circle');

      if (countEl) countEl.innerText = `${count} / ${total} 處`;
      if (pctEl) pctEl.innerText = `${pct}%`;
      if (circleEl) circleEl.setAttribute('stroke-dasharray', `${pct}, 100`);
    }

    function toggleCheck(id) {
      if (checkedItems.has(id)) {
        checkedItems.delete(id);
        showToast('已取消此行程標記', '↩️');
      } else {
        checkedItems.add(id);
        showToast('太棒了！已打卡造訪此站', '🎉');
      }
      saveStorage();
      renderItineraryCards();
    }

    // ================= 分頁切換 (Lazy Init) =================
    function switchTab(tab) {
      if (activeTab === tab) return;
      activeTab = tab;

      const listBtn = document.getElementById('tab-btn-list');
      const mapBtn = document.getElementById('tab-btn-map');
      const listView = document.getElementById('view-list');
      const mapView = document.getElementById('view-map');

      if (tab === 'list') {
        listView.classList.remove('hidden');
        mapView.classList.add('hidden');

        listBtn.className = 'flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-bold transition-all duration-200 bg-white text-seto-800 shadow-sm';
        mapBtn.className = 'flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-600 hover:text-slate-900';
      } else {
        listView.classList.add('hidden');
        mapView.classList.remove('hidden');

        mapBtn.className = 'flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-bold transition-all duration-200 bg-white text-seto-800 shadow-sm';
        listBtn.className = 'flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-600 hover:text-slate-900';

        // 延遲初始化或重繪尺寸
        if (!leafletMap) {
          requestAnimationFrame(() => {
            setTimeout(() => {
              initLeafletMap();
            }, 60);
          });
        } else {
          requestAnimationFrame(() => {
            setTimeout(() => {
              if (leafletMap) {
                leafletMap.invalidateSize(true);
                fitMapToCurrentFilter();
              }
            }, 80);
          });
        }
      }
    }

    // ================= 地圖初始化與圖資載入 (100% 免 API Key) =================
    function initLeafletMap() {
      const container = document.getElementById('full-screen-map');
      if (!container) return;

      // 預設中心鎖定瀨戶內海 (涵蓋廣島、愛媛、小豆島與香川)
      leafletMap = L.map('full-screen-map', {
        center: [34.3300, 133.2500],
        zoom: 9,
        zoomSnap: 0.5,
        zoomControl: false,
        attributionControl: false
      });

      // 載入色調柔和、繁體中文與日文字體清晰的 Esri 街景底圖 (完全免費、免金鑰、零浮水印)
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
      }).addTo(leafletMap);

      markersLayer = L.layerGroup().addTo(leafletMap);

      renderMapMarkers();
      renderMapCarousel();

      setTimeout(() => {
        if (leafletMap) {
          leafletMap.invalidateSize(true);
          resetMapBounds();
        }
      }, 150);
    }

    function forceRefreshMap() {
      if (!leafletMap) {
        initLeafletMap();
      } else {
        leafletMap.invalidateSize(true);
        resetMapBounds();
      }
      showToast('地圖已完成刷新重繪', '🔄');
    }

    // ================= 地圖自訂圖釘生成 =================
    function createCustomMarkerIcon(item) {
      let iconInner = '';
      let labelClass = 'marker-label';

      if (item.type === 'hotel') {
        // 住宿：金色巨星 + 脈衝呼吸水波
        iconInner = `
          <div class="marker-hotel">
            <span>⭐</span>
            <div class="hotel-pulse"></div>
          </div>
        `;
        labelClass += ' marker-label-hotel';
      } else if (item.type === 'food') {
        // 美食：暖橘紅圓標
        iconInner = `
          <div class="marker-food">
            <span>${item.icon}</span>
          </div>
        `;
      } else if (item.type === 'transport') {
        // 交通：蔚藍圓標
        iconInner = `
          <div class="marker-transport">
            <span>${item.icon}</span>
          </div>
        `;
      } else {
        // 景點：翠綠圓標
        iconInner = `
          <div class="marker-spot">
            <span>${item.icon}</span>
          </div>
        `;
      }

      const shortTitle = item.name.split(' ')[0].replace('廣島', '').replace('小豆島', '');
      const iconHtml = `
        <div class="custom-marker-wrapper">
          ${iconInner}
          <div class="${labelClass}">D${item.day} ${shortTitle}</div>
        </div>
      `;

      return L.divIcon({
        className: '',
        html: iconHtml,
        iconSize: [42, 42],
        iconAnchor: [21, 21],
        popupAnchor: [0, -22]
      });
    }

    // 渲染所有圖釘
    function renderMapMarkers() {
      if (!markersLayer) return;
      markersLayer.clearLayers();

      ITINERARY_DATA.forEach(item => {
        if (currentMapCat !== 'all' && item.type !== currentMapCat) return;

        const icon = createCustomMarkerIcon(item);
        const marker = L.marker([item.lat, item.lng], { icon: icon });

        // 資訊氣泡 (Popup)
        const popupContent = `
          <div class="p-3 max-w-[270px] text-slate-800">
            <div class="flex items-center justify-between gap-1 mb-1.5">
              <span class="text-[9.5px] font-bold px-2 py-0.5 rounded-full ${
                item.type === 'hotel' ? 'bg-amber-100 text-amber-800' :
                item.type === 'food' ? 'bg-orange-100 text-orange-800' :
                item.type === 'transport' ? 'bg-sky-100 text-sky-800' : 'bg-emerald-100 text-emerald-800'
              }">
                Day ${item.day} ‧ ${item.categoryName}
              </span>
              <span class="text-[10px] font-semibold text-slate-500">${item.time.split('‧')[0]}</span>
            </div>
            
            <h4 class="text-sm font-black text-slate-900 leading-tight">${item.name}</h4>
            <div class="text-[10px] text-slate-500 font-medium mb-1">${item.jpName}</div>
            
            <p class="text-[11px] text-slate-600 line-clamp-2 mt-1 leading-snug">${item.desc}</p>
            
            <div class="text-[10px] text-slate-500 mt-2 flex items-start gap-1">
              <span class="shrink-0">📍</span>
              <span class="truncate">${item.address}</span>
            </div>

            <div class="grid grid-cols-2 gap-1.5 mt-2.5 pt-2 border-t border-slate-100">
              <button onclick="copySpotName('${item.name}')" class="flex items-center justify-center gap-1 py-1.5 bg-slate-100 rounded-lg text-[11px] font-bold text-slate-700 active:bg-slate-200">
                📋 複製店名
              </button>
              <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.query)}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1 py-1.5 bg-seto-600 rounded-lg text-[11px] font-bold text-white shadow-xs active:bg-seto-700">
                📍 Google 導航
              </a>
            </div>
          </div>
        `;

        marker.bindPopup(popupContent, { maxWidth: 290, closeButton: false });

        marker.on('click', () => {
          scrollCarouselToItem(item.id);
        });

        marker.addTo(markersLayer);
        markerMap[item.id] = marker;
      });
    }

    // 地圖底部輪播卡片
    function renderMapCarousel() {
      const carousel = document.getElementById('map-carousel');
      if (!carousel) return;

      const filtered = ITINERARY_DATA.filter(item => currentMapCat === 'all' || item.type === currentMapCat);

      carousel.innerHTML = filtered.map(item => {
        return `
          <div 
            id="carousel-card-${item.id}"
            onclick="flyToMapPlace('${item.id}')"
            class="snap-center shrink-0 w-[240px] bg-white/95 backdrop-blur-md rounded-2xl p-3 border border-slate-200 shadow-elevated active:scale-98 transition-all cursor-pointer"
          >
            <div class="flex items-start justify-between gap-1 mb-1">
              <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${
                item.type === 'hotel' ? 'bg-amber-100 text-amber-800' :
                item.type === 'food' ? 'bg-orange-100 text-orange-800' :
                item.type === 'transport' ? 'bg-sky-100 text-sky-800' : 'bg-emerald-100 text-emerald-800'
              }">
                Day ${item.day} ‧ ${item.categoryName}
              </span>
              <span class="text-[9px] font-medium text-slate-400 truncate max-w-[100px]">${item.tag}</span>
            </div>
            
            <h4 class="text-xs font-bold text-slate-900 truncate flex items-center gap-1">
              <span>${item.icon}</span>
              <span>${item.name}</span>
            </h4>
            
            <p class="text-[10px] text-slate-500 line-clamp-1 mt-0.5 leading-snug">${item.address}</p>

            <div class="flex items-center justify-between mt-2 pt-1.5 border-t border-slate-100 text-[10px]">
              <span class="text-seto-600 font-bold flex items-center gap-0.5">
                <span>🎯</span> 點擊飛往
              </span>
              <a 
                href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.query)}" 
                target="_blank" 
                rel="noopener noreferrer" 
                onclick="event.stopPropagation()"
                class="px-2 py-0.5 bg-seto-50 text-seto-800 border border-seto-200 rounded-md font-bold"
              >
                📍 導航
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function flyToMapPlace(id) {
      const item = ITINERARY_DATA.find(p => p.id === id);
      if (!item || !leafletMap) return;

      leafletMap.flyTo([item.lat, item.lng], 16, { duration: 1.2 });
      const marker = markerMap[id];
      if (marker) {
        setTimeout(() => {
          marker.openPopup();
        }, 850);
      }
      scrollCarouselToItem(id);
    }

    function scrollCarouselToItem(id) {
      const card = document.getElementById(`carousel-card-${id}`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function jumpToMapPlace(id) {
      switchTab('map');
      setTimeout(() => {
        flyToMapPlace(id);
      }, 250);
    }

    function filterMapCategory(cat) {
      currentMapCat = cat;
      document.querySelectorAll('.map-chip').forEach(btn => {
        const isMatch = btn.getAttribute('data-mcat') === cat;
        if (isMatch) {
          btn.className = 'map-chip px-2.5 py-1 rounded-full text-[11px] font-bold transition-all whitespace-nowrap bg-slate-900/90 text-white shadow-md backdrop-blur-md';
        } else {
          btn.className = 'map-chip px-2.5 py-1 rounded-full text-[11px] font-medium transition-all whitespace-nowrap bg-white/95 text-slate-800 border border-slate-200 shadow-md backdrop-blur-md';
        }
      });
      renderMapMarkers();
      renderMapCarousel();
      fitMapToCurrentFilter();
    }

    // 區域快捷跳轉
    function flyToRegion(region) {
      if (!leafletMap) return;
      if (region === 'hiroshima') {
        leafletMap.flyTo([34.3980, 132.4570], 14.5, { duration: 1.2 });
        showToast('已聚焦「廣島市區」周邊', '📍');
      } else if (region === 'miyajima') {
        leafletMap.flyTo([34.2980, 132.3210], 15, { duration: 1.2 });
        showToast('已聚焦「宮島・嚴島神社」', '⛩️');
      } else if (region === 'kurashiki') {
        leafletMap.flyTo([34.5955, 133.7718], 15.5, { duration: 1.2 });
        showToast('已聚焦「岡山倉敷・美觀地區」', '🏮');
      } else if (region === 'washuzan') {
        leafletMap.flyTo([34.4370, 133.8115], 14.5, { duration: 1.2 });
        showToast('已聚焦「鷲羽山・瀨戶大橋」', '🌉');
      } else if (region === 'shodoshima') {
        leafletMap.flyTo([34.4850, 134.2800], 12.5, { duration: 1.2 });
        showToast('已聚焦「小豆島」全島', '🫒');
      } else if (region === 'takamatsu') {
        leafletMap.flyTo([34.3500, 134.0500], 14, { duration: 1.2 });
        showToast('已聚焦「香川高松」周邊', '🍜');
      }
    }

    function resetMapBounds() {
      if (!leafletMap) return;
      const group = L.featureGroup(ITINERARY_DATA.map(p => L.marker([p.lat, p.lng])));
      leafletMap.fitBounds(group.getBounds(), {
        paddingTopLeft: [20, 65],
        paddingBottomRight: [50, 135],
        maxZoom: 14
      });
      showToast('已還原瀨戶內海全景視野', '🌐');
    }

    function fitMapToCurrentFilter() {
      if (!leafletMap) return;
      const filtered = ITINERARY_DATA.filter(item => currentMapCat === 'all' || item.type === currentMapCat);
      if (filtered.length === 0) return;
      const group = L.featureGroup(filtered.map(p => L.marker([p.lat, p.lng])));
      leafletMap.fitBounds(group.getBounds().pad(0.15));
    }

    function locateUserPosition() {
      if (!navigator.geolocation) {
        showToast('您的裝置未支援 GPS 定位', '⚠️');
        return;
      }
      showToast('正在偵測您的 GPS 位置...', '📡');

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          if (gpsMarker && leafletMap) {
            leafletMap.removeLayer(gpsMarker);
          }

          const userIcon = L.divIcon({
            className: '',
            html: '<div class="gps-marker"><div class="gps-pulse-ring"></div></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });

          if (leafletMap) {
            gpsMarker = L.marker([lat, lng], { icon: userIcon }).addTo(leafletMap);
            gpsMarker.bindPopup('<div class="p-2 text-xs font-bold text-blue-700">📍 目前所在位置</div>').openPopup();
            leafletMap.flyTo([lat, lng], 15, { duration: 1.2 });
            showToast('已定位至目前所在位置', '🎯');
          }
        },
        () => {
          showToast('無法取得定位，請確認手機定位權限已開啟', '⚠️');
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    // ================= 行程清單邏輯 (List Tab) =================
    function filterDay(day) {
      currentDayFilter = day;
      document.querySelectorAll('.day-chip').forEach(btn => {
        const isMatch = btn.getAttribute('data-day') === String(day);
        if (isMatch) {
          btn.className = 'day-chip px-3 py-1.5 rounded-full text-xs font-bold transition-all whitespace-nowrap bg-seto-700 text-white shadow-xs';
        } else {
          btn.className = 'day-chip px-3 py-1.5 rounded-full text-xs font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200';
        }
      });

      const daySummary = document.getElementById('day-summary-text');
      if (day === 'all') {
        daySummary.innerText = '顯示全部 5 天行程';
      } else {
        const titles = {
          1: 'Day 1 廣島・歷史重現與和平祈願',
          2: 'Day 2 宮島・滿潮水上鳥居與夕陽漫步',
          3: 'Day 3 廣島城・倉敷美觀・鷲羽山・瀨戶大橋',
          4: 'Day 4 小豆島・寒霞溪與自然人文風光',
          5: 'Day 5 高松・靈場巡禮與賦歸返台'
        };
        daySummary.innerText = titles[day] || `Day ${day} 行程`;
      }

      renderItineraryCards();
    }

    function filterCategory(cat) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.cat-chip').forEach(btn => {
        const isMatch = btn.getAttribute('data-cat') === cat;
        if (isMatch) {
          btn.className = 'cat-chip px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all whitespace-nowrap bg-slate-800 text-white shadow-2xs';
        } else {
          btn.className = 'cat-chip px-2.5 py-1 rounded-lg text-[11px] font-medium transition-all whitespace-nowrap bg-white text-slate-700 border border-slate-200';
        }
      });
      renderItineraryCards();
    }

    function resetFilters() {
      currentDayFilter = 'all';
      currentCategoryFilter = 'all';
      searchQuery = '';
      document.getElementById('list-search-input').value = '';
      document.getElementById('list-clear-search').classList.add('hidden');
      filterDay('all');
      filterCategory('all');
    }

    function renderItineraryCards() {
      const container = document.getElementById('itinerary-cards-container');
      const emptyState = document.getElementById('list-empty-state');

      const filtered = ITINERARY_DATA.filter(item => {
        // 天數過濾
        if (currentDayFilter !== 'all' && item.day !== Number(currentDayFilter)) return false;

        // 類別過濾
        if (currentCategoryFilter === 'checked') {
          if (!checkedItems.has(item.id)) return false;
        } else if (currentCategoryFilter !== 'all') {
          if (item.type !== currentCategoryFilter) return false;
        }

        // 搜尋
        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          const matchName = item.name.toLowerCase().includes(q);
          const matchJp = item.jpName.toLowerCase().includes(q);
          const matchDesc = item.desc.toLowerCase().includes(q);
          const matchTip = item.tip.toLowerCase().includes(q);
          const matchAddr = item.address.toLowerCase().includes(q);
          if (!matchName && !matchJp && !matchDesc && !matchTip && !matchAddr) return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // 依天數分組標頭渲染
      let lastRenderedDay = null;
      let html = '';

      filtered.forEach((item) => {
        const isChecked = checkedItems.has(item.id);

        // 若切換到不同天數且是在看「全部天數」時，輸出清爽的天數分隔條
        if (currentDayFilter === 'all' && lastRenderedDay !== item.day) {
          lastRenderedDay = item.day;
          html += `
            <div class="pt-2 pb-1">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-md bg-seto-700 text-white text-xs font-black tracking-wide">
                  Day ${item.day}
                </span>
                <span class="text-xs font-bold text-slate-800">${item.dayTitle}</span>
                <span class="text-[10px] text-slate-400 font-medium">(${item.date.split(' ')[0]})</span>
              </div>
            </div>
          `;
        }

        let badge = '';
        if (item.type === 'hotel') {
          badge = '<span class="text-[10px] font-bold text-amber-800 bg-amber-100 border border-amber-300 px-2 py-0.5 rounded-md">⭐ 住宿飯店</span>';
        } else if (item.type === 'food') {
          badge = '<span class="text-[10px] font-bold text-orange-800 bg-orange-100 border border-orange-200 px-2 py-0.5 rounded-md">🍜 精選美食</span>';
        } else if (item.type === 'transport') {
          badge = '<span class="text-[10px] font-bold text-sky-800 bg-sky-100 border border-sky-200 px-2 py-0.5 rounded-md">🚢 交通渡輪</span>';
        } else {
          badge = '<span class="text-[10px] font-bold text-emerald-800 bg-emerald-100 border border-emerald-200 px-2 py-0.5 rounded-md">⛩️ 必訪景點</span>';
        }

        html += `
          <article class="bg-white border ${isChecked ? 'border-emerald-200 bg-emerald-50/15' : 'border-slate-200'} rounded-2xl p-4 shadow-soft transition-all duration-300">
            <!-- 標題列 -->
            <div class="flex items-start justify-between gap-2.5">
              <div class="flex-1">
                <div class="flex flex-wrap items-center gap-1.5 mb-1">
                  <span class="text-[10px] font-black text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded">#${item.seq}</span>
                  <span class="text-[10px] font-bold text-seto-700 bg-seto-50 px-1.5 py-0.5 rounded">D${item.day}</span>
                  ${badge}
                </div>
                <h3 class="text-base font-black text-slate-900 tracking-tight flex items-center gap-1.5 ${isChecked ? 'line-through text-slate-400' : ''}">
                  <span>${item.icon}</span>
                  <span>${item.name}</span>
                </h3>
                <div class="text-[11px] text-slate-500 font-medium">${item.jpName}</div>
              </div>

              <!-- 打卡勾選鈕 -->
              <button 
                onclick="toggleCheck('${item.id}')" 
                class="shrink-0 w-8 h-8 rounded-xl flex items-center justify-center transition-all ${isChecked ? 'bg-emerald-600 text-white shadow-xs' : 'bg-slate-100 text-slate-300 hover:bg-slate-200'}"
                aria-label="打卡標記"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                </svg>
              </button>
            </div>

            <!-- 時間與移動提示 -->
            <div class="mt-2 flex items-center justify-between flex-wrap gap-1 bg-slate-50 border border-slate-100 rounded-xl px-2.5 py-1.5 text-xs text-slate-600">
              <div class="flex items-center gap-1.5 font-bold text-seto-700">
                <span>🕒</span>
                <span>${item.time}</span>
              </div>
              ${item.transit ? `<div class="text-[11px] text-slate-500 font-medium">➡️ ${item.transit}</div>` : ''}
            </div>

            <!-- 說明內文 -->
            <p class="text-xs leading-relaxed text-slate-600 mt-2 font-normal ${isChecked ? 'opacity-70' : ''}">
              ${item.desc}
            </p>

            <!-- 貼士提醒 -->
            <div class="mt-2.5 flex items-start gap-1.5 bg-amber-50/80 border border-amber-200/70 rounded-xl p-2 text-[11px] text-amber-900">
              <span class="shrink-0 text-amber-600 font-bold">💡 隨行貼士：</span>
              <span class="leading-snug">${item.tip}</span>
            </div>

            <!-- 地址 -->
            <div class="mt-2 pt-2 border-t border-dashed border-slate-100 text-[11px] text-slate-500 flex items-start gap-1">
              <span class="shrink-0">📍</span>
              <span class="truncate">${item.address}</span>
            </div>

            <!-- 操作按鈕組：複製店名、地圖定位、Google 導航 -->
            <div class="grid grid-cols-3 gap-2 mt-3 pt-1">
              <button 
                onclick="copySpotName('${item.name}')" 
                class="flex items-center justify-center gap-1 py-2 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold text-xs active:bg-slate-100 transition-all shadow-2xs"
              >
                <span>📋</span> 複製名稱
              </button>

              <button 
                onclick="jumpToMapPlace('${item.id}')" 
                class="flex items-center justify-center gap-1 py-2 bg-seto-50 border border-seto-200 text-seto-800 rounded-xl font-bold text-xs active:bg-seto-100 transition-all shadow-2xs"
              >
                <span>🗺️</span> 看地圖
              </button>

              <a 
                href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.query)}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="flex items-center justify-center gap-1 py-2 bg-seto-600 text-white rounded-xl font-bold text-xs active:bg-seto-700 transition-all shadow-2xs"
              >
                <span>📍</span> 導航
              </a>
            </div>
          </article>
        `;
      });

      container.innerHTML = html;
    }

    // 複製地點名稱至剪貼簿
    function copySpotName(name) {
      try {
        const textArea = document.createElement("textarea");
        textArea.value = name;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        textArea.style.top = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const successful = document.execCommand('copy');
        document.body.removeChild(textArea);
        if (successful) {
          showToast(`已複製「${name}」！`, '📋');
        } else {
          showToast('複製失敗，請手動複製', '⚠️');
        }
      } catch (err) {
        showToast('複製失敗', '⚠️');
      }
    }

    // 浮動 Toast 提示
    let toastTimer = null;
    function showToast(msg, icon = '📋') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.innerText = msg;
      toastIcon.innerText = icon;

      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2200);
    }

    // ================= 頁面啟動載入 =================
    document.addEventListener('DOMContentLoaded', () => {
      initStorage();

      // 搜尋事件
      const searchInput = document.getElementById('list-search-input');
      const clearBtn = document.getElementById('list-clear-search');

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        if (searchQuery.trim().length > 0) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
        renderItineraryCards();
      });

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearBtn.classList.add('hidden');
        renderItineraryCards();
      });

      renderItineraryCards();

      // 螢幕旋轉自動重繪地圖
      window.addEventListener('resize', () => {
        if (leafletMap && activeTab === 'map') {
          leafletMap.invalidateSize(true);
        }
      });
    });
  </script>
</body>
</html>
